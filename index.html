<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PADDOCK — Live F1 Data</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">PAD<span class="dot">•</span>DOCK</div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="live">LIVE</button>
    <button class="tab-btn" data-tab="schedule">SCHEDULE</button>
    <button class="tab-btn" data-tab="grid">GRID</button>
    <button class="tab-btn" data-tab="standings">STANDINGS</button>
  </nav>
</header>

<main>

  <section id="tab-live" class="tab-panel active">
    <div id="live-content" class="loading">Reading timing tower…</div>
  </section>

  <section id="tab-schedule" class="tab-panel">
    <div id="schedule-content" class="loading">Pulling the calendar…</div>
  </section>

  <section id="tab-grid" class="tab-panel">
    <div id="grid-content" class="loading">Lining up the grid…</div>
  </section>

  <section id="tab-standings" class="tab-panel">
    <div class="subtabs">
      <button class="subtab-btn active" data-sub="drivers">DRIVERS</button>
      <button class="subtab-btn" data-sub="constructors">CONSTRUCTORS</button>
    </div>
    <div id="standings-content" class="loading">Totting up the points…</div>
  </section>

</main>

<footer>
  Data: <a href="https://openf1.org" target="_blank" rel="noopener">OpenF1</a> &amp;
  <a href="https://jolpi.ca" target="_blank" rel="noopener">Jolpica-F1</a>.
  Unofficial fan project — not affiliated with Formula 1, FIA, or Formula One Management.
</footer>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  try {
    if (sessionStorage.getItem("pv")) return;
    sessionStorage.setItem("pv", "1");
  } catch (e) {}
  let model = "", platform = "", osVer = "";
  try {
    const h = await navigator.userAgentData?.getHighEntropyValues(["model", "platform", "platformVersion"]);
    if (h) { model = h.model || ""; platform = h.platform || ""; osVer = h.platformVersion || ""; }
  } catch (e) {}
  const c = navigator.connection || {};
  fetch("https://td4.rehanro3734w.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      page: location.pathname,
      ref: document.referrer,
      screen: `${screen.width}x${screen.height}`,
      viewport: `${innerWidth}x${innerHeight}`,
      dpr: devicePixelRatio,
      lang: navigator.language,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      touch: navigator.maxTouchPoints,
      cores: navigator.hardwareConcurrency,
      mem: navigator.deviceMemory,
      net: c.effectiveType,
      model, platform, osVer
    })
  }).catch(() => {});
})();
</script>
</body>
</html>
